<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUV_LINAAAA — Bio Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      background: radial-gradient(circle at 50% 15%, #ff2e93 0%, #5b1865 45%, #190a28 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 36px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Фоновое свечение */
    body::before {
      content: "";
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(255, 56, 156, 0.45), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Контейнер падающих лепестков и звёзд */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      top: -20px;
      width: 12px;
      height: 8px;
      background: linear-gradient(135deg, #ff5ca8, #c9186a);
      border-radius: 10px 0 10px 0;
      opacity: 0.75;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg) translateX(0);
      }
      50% {
        transform: translateY(50vh) rotate(180deg) translateX(25px);
      }
      100% {
        transform: translateY(105vh) rotate(360deg) translateX(-15px);
      }
    }

    .container {
      width: 100%;
      max-width: 410px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* Аватарка */
    .avatar-wrap {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #ff4da6, #3897ff, #ff2e93);
      box-shadow: 0 0 28px rgba(255, 46, 147, 0.75);
      margin-bottom: 18px;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      background-color: #2b103b;
    }

    /* Ник и описание */
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 0 14px rgba(255, 110, 180, 0.55);
    }

    .bio {
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 26px;
      max-width: 310px;
    }

    /* Список кнопок */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 12px 18px;
      border-radius: 50px;
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 150, 210, 0.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(15, 4, 28, 0.35);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .link-card:hover {
      transform: translateY(-2px) scale(1.01);
      background: rgba(255, 77, 166, 0.18);
      box-shadow: 0 10px 28px rgba(255, 46, 147, 0.4);
    }

    .icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff2e93, #ff5eb0);
      box-shadow: 0 0 14px rgba(255, 46, 147, 0.65);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .icon-circle svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .link-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .link-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
    }

    .link-sub {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.72);
      margin-top: 2px;
    }

    .footer {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.78);
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>

  </main>

  <script>
    const container = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = (6 + Math.random() * 7) + 's';
      petal.style.animationDelay = (-Math.random() * 10) + 's';
      petal.style.transform = `scale(${0.7 + Math.random() * 0.7})`;
      container.appendChild(petal);
    }
  </script>
</body>
</html>
